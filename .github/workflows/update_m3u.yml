name: Update KabloTV M3U

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik çalışır
  workflow_dispatch: # GitHub sayfasından manuel tetikleme butonu

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Dosyayı depoya geri commit edebilmek için yetki

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests playwright

      - name: Install Playwright Chromium dependencies
        run: playwright install chromium --with-deps

      - name: Run script
        run: python update_m3u.py

      - name: Commit and push if M3U changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add kablo_tv.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update KabloTV M3U playlist [skip ci]" && git push)
