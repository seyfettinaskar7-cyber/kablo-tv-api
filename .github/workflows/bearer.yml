name: Run Token Scraper

on:
  # Belirli aralıklarla otomatik çalışması için (Örn: Her gün UTC saat 00:00'da)
  schedule:
    - cron: '0 0 * * *'
  
  # Manuel olarak Actions sekmesinden tetiklenebilmesi için
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Repo'yu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Python Ortamını Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Python Scriptini Çalıştır
      run: python bearer.py

    - name: Değişiklikleri Kaydet ve Gönder (Commit & Push)
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add bearer.txt
        git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update bearer.txt via GitHub Actions" && git push)
